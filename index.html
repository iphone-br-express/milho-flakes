<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pagamento Pix</title>
  <style>
    body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}
    .box{max-width:480px;margin:40px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 10px 35px #0001}
    label{display:block;margin:15px 0 7px;font-weight:700}
    input,textarea{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;box-sizing:border-box}
    button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}
    .hidden{display:none}.qr{display:block;width:260px;height:260px;margin:15px auto}.erro{color:#b42318}
  </style>
</head>
<body>
<div class="box">
  <h1>Pagamento via Pix</h1>
  <form id="form">
    <label>Valor</label><input id="amount" type="number" min=".01" step=".01" required>
    <label>Descrição</label><input id="description" value="Pagamento do pedido" required>
    <label>Nome</label><input id="payerName" required>
    <label>CPF</label><input id="payerDocument" inputmode="numeric" required>
    <button id="btn">Gerar Pix</button>
  </form>
  <div id="resultado" class="hidden"></div>
</div>
<script src="script.js"></script>
</body>
</html>
