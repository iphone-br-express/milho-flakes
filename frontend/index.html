<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teste PIX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Pagamento PIX</h1>
    <p class="muted">Teste de integração direta com a API PlusPix.</p>

    <form id="depositForm">
      <label>Nome do cliente
        <input id="payerName" required placeholder="Nome completo">
      </label>
      <label>CPF
        <input id="payerDocument" required placeholder="000.000.000-00" inputmode="numeric">
      </label>
      <label>Valor (R$)
        <input id="amount" required type="number" min="0.01" step="0.01" placeholder="10,00">
      </label>
      <label>Descrição
        <input id="description" value="Pagamento PIX">
      </label>
      <button type="submit">Gerar PIX</button>
    </form>

    <section id="result" class="result hidden">
      <h2>PIX gerado</h2>
      <p><b>Status:</b> <span id="status">-</span></p>
      <p><b>Transação:</b> <span id="transactionId">-</span></p>
      <img id="qr" class="qr hidden" alt="QR Code PIX">
      <label>Pix Copia e Cola
        <textarea id="copyPaste" rows="5" readonly></textarea>
      </label>
      <button id="copyBtn" type="button">Copiar Pix</button>
      <button id="checkBtn" type="button" class="secondary">Consultar pagamento</button>
    </section>

    <p id="message" class="message"></p>
    <p class="warning">ATENÇÃO: este modo expõe o Client Secret no navegador. Use somente para teste e não publique uma credencial de produção.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
